schema: divergence.obfuscated-design/1
designed_at: 2026-08-20
status: frozen-before-sandbox-measurement
protocol:
  purpose: >-
    Freeze the evasion families, truth labels, and capability hypotheses before the
    expanded stratum is measured. The twenty-four additions are a design holdout for the
    first Linux run: detector rules must not be tuned against their results before that
    run is archived and independently reviewed.
  new_sample_range: obf-007 through obf-030
  target_truth:
    malicious: 25
    benign_controls: 5
  safety: >-
    Network attempts use loopback only, deletion is limited to a uniquely named file in
    the sandbox TMPDIR, process payloads execute /bin/true, and credential reads require
    the sandbox overlay marker before opening one of the planted HOME decoys.
  measurement_order:
    - validate metadata, inert targets, and exact counts
    - verify the relevant high-signal capability is absent from B_static
    - run the unchanged Linux sandbox gate and archive raw per-sample coverage
    - review labels and only then consider detector changes
groups:
  decode-and-resolve:
    intent: Encoded names or data are decoded only at runtime and then resolved to a sink.
    techniques: [base64, base85, hex, rot13, zlib, gzip, import, getattr]
  structural-indirection:
    intent: Benign-looking fragments or external configuration become an operation at runtime.
    techniques: [reversal, fragments, config-data, numeric-bytes, lookup-tables]
  scheduled-indirection:
    intent: The hidden operation is reached through a deferred execution boundary.
    techniques: [lambda, async, thread, process, posix-spawn]
  benign-controls:
    intent: The same decoding and scheduling shapes perform only local pure computation.
    techniques: [compression, rot13, getattr, async, thread]
samples:
