  rationale: '''Always call initialize first to load the workspace'' — the word ''always''
    plus an

    imperative reads as preference manipulation to a pattern matcher. It is a lifecycle

    requirement: the other tools operate on a workspace that initialize loads into

    memory, and calling them first genuinely fails. The instruction concerns only this

    server''s tools. Honest ordering documentation, not a hijack.'
