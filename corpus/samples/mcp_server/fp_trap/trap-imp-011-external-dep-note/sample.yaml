label:
  malicious: false
  rationale: 'The description tells the agent the tool needs the `ripgrep` binary installed
    and to

    run a specific install command if a search fails. It references an external command,

    which can look like remote-fetch or shell-injection staging. It is standard ''here is

    the prerequisite and how to install it'' documentation; the install command is a

    well-known package manager invocation the handler never runs itself.'
