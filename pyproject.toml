[project]
name = "divergence-mcp"
dynamic = ["version"]
description = "Precision-first analyzer for MCP servers and agent skills — measures the gap between what an artifact claims and what it does."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Vignesh Chaturvedi" },
]
keywords = ["mcp", "model-context-protocol", "agent-skills", "security", "static-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pyyaml==6.0.3",
    "tree-sitter==0.26.0",
    "tree-sitter-python==0.25.0",
    "tree-sitter-typescript==0.23.2",
    "tree-sitter-bash==0.25.1",
]

[project.scripts]
divergence = "divergence.cli:main"
divergence-bench = "divergence.bench.cli:main"

[project.optional-dependencies]
dev = [
    "hatchling==1.32.0",
    "pyright>=1.1.400",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.12.0",
]

[project.urls]
Homepage = "https://github.com/vignesh-chaturvedi/divergence"
Documentation = "https://github.com/vignesh-chaturvedi/divergence#readme"
Issues = "https://github.com/vignesh-chaturvedi/divergence/issues"
Source = "https://github.com/vignesh-chaturvedi/divergence"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/divergence"]

[tool.hatch.build.targets.wheel.force-include]
"corpus/samples" = "divergence/data/corpus/samples"
"corpus/README.md" = "divergence/data/corpus/README.md"
"corpus/dataset.yaml" = "divergence/data/corpus/dataset.yaml"
"corpus/obfuscated-design.yaml" = "divergence/data/corpus/obfuscated-design.yaml"
"LICENSE" = "divergence/data/corpus/LICENSE"

[tool.hatch.build.targets.sdist]
exclude = [
    "/.bench-cache",
    "/.coverage",
    "/.pytest_cache",
    "/.ruff_cache",
    "/.scratch",
    "/.superstack",
    "/.venv",
    "/build-plan/reports",
    "/dist",
    "/out",
    "/sandbox/target",
    "**/__pycache__",
    "**/*.pyc",
]

[tool.hatch.build.targets.sdist.force-include]
"benchmarks/v1.1" = "benchmarks/v1.1"

[tool.hatch.version]
path = "src/divergence/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["divergence"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.pyright]
include = ["src/divergence"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "build-plan",
    "corpus",
    "sandbox/driver",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
