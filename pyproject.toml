[project]
name = "divergence"
version = "0.1.0"
description = "Precision-first analyzer for MCP servers and agent skills — measures the gap between what an artifact claims and what it does."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "pyyaml>=6.0.2",
]

[project.scripts]
divergence = "divergence.cli:main"
divergence-bench = "divergence.bench.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/divergence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
