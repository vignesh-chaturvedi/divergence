[package]
name = "divergence-sandbox"
version = "1.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Kernel-enforced observation of what an MCP server or agent skill actually touches."

[[bin]]
name = "divergence-sandbox"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
seccompiler = "0.4"
nix = { version = "0.29", features = ["process", "ptrace", "signal", "sched", "mount", "user", "fs"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
strip = true
